[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voxflow"
version = "0.1.0"
description = "Local-first voice writing assistant for Ubuntu GNOME Wayland"
requires-python = "==3.12.14"
dependencies = [
    "faster-whisper==1.2.1",
    "av==18.1.0",
    "pydantic==2.12.4",
    "dbus-next==0.2.3",
    "sounddevice==0.5.6",
    "numpy==2.5.4",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
]

[project.scripts]
voxflow = "voxflow.__main__:main"

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[tool.setuptools.package-data]
"voxflow.providers" = ["catalog.json"]
